plugins {
    id "architectury-plugin" version "3.5.170"
    id "dev.architectury.loom-no-remap" version "1.17.493" apply false
    id "com.gradleup.shadow" version "9.4.3" apply false
}

architectury {
    minecraft = rootProject.property("minecraft_version")
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = rootProject.property("archives_base_name")
    version = rootProject.property("mod_version")
    group = rootProject.property("maven_group")

    repositories {
        mavenCentral()
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.theillusivec4.top/" }
        maven { url "https://maven.shedaniel.me/" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    loom {
        if (project.path != ":common") {
            runs {
                configureEach {
                    vmArgs("-Xms512M", "-Xmx2G", "-XX:+UseG1GC")
                }
                client2 {
                    client()
                    configName = "Minecraft Client 2"
                    runDir = "run_client2"
                    programArgs("--username", "Dev2")
                }
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.property('minecraft_version')}"
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
        testImplementation "org.assertj:assertj-core:3.25.3"
        testImplementation "org.mockito:mockito-core:5.24.0"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs("-XX:+EnableDynamicAgentLoading")
    }
}
